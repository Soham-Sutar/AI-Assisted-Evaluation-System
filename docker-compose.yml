services:
  postgres:
    image: postgres:16-alpine
    container_name: evalai_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-evalai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-evalai}
      POSTGRES_DB: ${POSTGRES_DB:-evalai}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-evalai} -d ${POSTGRES_DB:-evalai}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: evalai_backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+psycopg://${POSTGRES_USER:-evalai}:${POSTGRES_PASSWORD:-evalai}@postgres:5432/${POSTGRES_DB:-evalai}
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
